<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重建支持系统 | 16 名儿童纵向追踪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="badge">华南师范大学心理学院 · 艺境·愈心实践团</div>
    <h1>重建支持系统</h1>
    <p class="sub">非经济贫困主导型辍学儿童心理与就学变化的纵向追踪</p>
    <p class="sub2">16 名儿童，2025 至 2026 两轮入户追踪</p>
  </div>
</header>

<section class="block">
  <h2>风险轨迹</h2>
  <p class="note">纵轴为 5 级相对风险评分（1 最低，5 最高），综合心理症状、就学状态与社会功能赋值，仅用于可视化变化趋势。点击折线可查看该儿童详情。</p>
  <div class="chart-toolbar" id="chartToolbar"></div>
  <div id="chart" class="chart"></div>
</section>

<section class="block">
  <h2>16 名儿童的具体情况</h2>
  <div class="filters" id="filters"></div>
  <div class="cards" id="cards"></div>
</section>

<footer>
  数据已匿名化（C1 至 C16），不含任何可识别个人身份的信息。
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
